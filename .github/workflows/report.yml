name: Dollar daily report

on:
  schedule:
    - cron: "5 14 * * *"   # ~09:05 Bogotá (UTC-5)
  workflow_dispatch:        # permitir ejecución manual

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python -m src.app.main

      - name: Commit results to repo (CSV/XLSX y logs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/output/*.csv data/output/*.xlsx logs/*.log || true
          git commit -m "Update daily report" || echo "No changes to commit"
          git push

      # ---- ARTIFACTS: descarga desde la pestaña Actions ----
      - name: Set run date
        run: echo "RUN_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Upload Excel/CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dollar-report-${{ env.RUN_DATE }}
          path: |
            data/output/dollar_daily.xlsx
            data/output/dollar_daily.csv
          if-no-files-found: error
          retention-days: 14

