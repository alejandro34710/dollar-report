name: Dollar daily report

on:
  schedule:
    - cron: "5 14 * * *"   # ~09:05 Bogotá (UTC-5)
  workflow_dispatch:        # permitir ejecución manual

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python -m src.app.main

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/output/*.csv data/output/*.xlsx logs/*.log || true
          git commit -m "Update daily report" || echo "No changes to commit"
          git push

      - name: Send email with Excel
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Reporte dólar diario"
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          body: "Adjunto el reporte actualizado."
          secure: true
          attachments: data/output/dollar_daily.xlsx
